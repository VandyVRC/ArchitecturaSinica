      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <link rel="stylesheet" type="text/css" href="/resources/bootstrap/css/bootstrap.min.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/sm-core-css.css" />
      
      <!-- Srophe styles -->
      
      <link rel="stylesheet" type="text/css" href="/resources/css/sm-core-css.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/style.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/arch-sinica-main.css" />
      
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alegreya+Sans+SC:100" />
      
      <link rel="stylesheet" type="text/css" media="print" href="/resources/css/print.css" />
      
      <!-- Leaflet -->
      
      <link rel="stylesheet" href="/resources/leaflet/leaflet.css" />
      
      <link rel="stylesheet" href="/resources/leaflet/leaflet.awesome-markers.css" />
      
      <!-- Date Slider -->
      
      <link rel="stylesheet" type="text/css" href="/resources/dateSlider/css/slider.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/dateSlider/css/slider-classic-min.css" />
      
      <!-- JQuery -->
      
      <link href="/resources/jquery-ui/jquery-ui.min.css" rel="stylesheet" />
      <script type="text/javascript" src="/resources/js/jquery.min.js"></script>
      <script type="text/javascript" src="/resources/jquery-ui/jquery-ui.min.js"></script>
      <script type="text/javascript" src="/resources/js/jquery.smartmenus.min.js"></script>
      <script type="text/javascript" src="/resources/js/clipboard.min.js"></script>
      
      <!-- Bootstrap -->
      <script type="text/javascript" src="/resources/bootstrap/js/bootstrap.min.js"></script>
      
      <!-- Date Slider -->
      <script src="/resources/dateSlider/js/jQDateRangeSlider-min.js"></script>
      <script defer="defer" data-domain="architecturasinica.org" src="https://plausible.io/js/script.js"></script>
      
      <!--<script src="https://www.google.com/recaptcha/api.js" type="text/javascript" async="async" defer="defer"/>-->
      <script type="text/javascript">
            $(document).ready(function () {
                $('[data-toggle="tooltip"]').tooltip({ container: 'body' })
            })
        </script>

   <body id="body">
      <script src="resources/js/navbar-search.js"></script>
      <div id="navbar-container"></div>
      <div class="padding-top" style="padding:0; margin-left:-25px;">
         <div class="row">
            <div class="col-md-4" >
               <div class="sidebar" style="background-color: #702020; height: 100vh; position: fixed; color: white; padding-top:75px;">
                  <h1 class="terminology-title" style="color: white; font-size: 28px; margin-bottom: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bibliography</h1>
                  <!-- Search Form -->
                  <div class="search-container" style="margin-bottom: 30px;">
                     <form method="get" action="bibliography.html" role="form">
                        <div class="form-group">
                           <label for="qs" style="color: white;">Keywords</label>
                           <input type="text" id="qs" name="q" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                        </div>
                        <div class="form-group">
                           <label for="title" style="color: white;">Title</label>
                           <input type="text" id="title" name="title" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                        </div>
                        <div class="form-group">
                           <label for="author" style="color: white;">Author/Editor</label>
                           <input type="text" id="author" name="author" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                        </div>
                        <div class="form-group">
                           <label for="pub-place" style="color: white;">Publication Place</label>
                           <input type="text" id="pub-place" name="pub-place" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                        </div>
                        <div class="form-group">
                           <label for="date" style="color: white;">Date</label>
                           <input type="text" id="date" name="date" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                        </div>
                        
                        <!-- Sort By Dropdown -->
                        <div class="form-group">
                           <label for="sort-by" style="color: white;">Sort by</label>
                           <select id="sort-by" name="sort-by" class="form-control" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;">
                              <option value="relevance">Relevance</option>
                              <option value="title">Title</option>
                              <option value="author">Author</option>
                              <option value="pubDate">Publication Date</option>
                              <option value="pubPlace">Publication Place</option>
                           </select>
                        </div>
                        
                        <button type="submit" class="btn btn-success btn-block" style="background-color: #4CAF50; border: none;">Search</button>
                     </form>
                  </div>
                  
                  <!-- Dynamic Categories with Improved Style -->
                  <div id="category-list" style="color: white; margin-top: 5px;">
                     <div data-template="app:display-facets" data-template-collection="bibl" data-template-facets="facet-def.xml" style="margin-top: 10px;">
                        <!-- Styling for categories -->
                        <style>
                            #category-list h4 {
                                color: white;
                                font-weight: bold;
                                margin-bottom: 15px;
                            }

                            #category-list a {
                                color: rgba(255, 255, 255, 0.9);
                                font-size: 15px;
                                padding: 10px 15px;
                                text-decoration: none;
                                display: block;
                                margin: 6px 0;
                                background-color: rgba(255, 255, 255, 0.15);
                                border-radius: 8px;
                                transition: background-color 0.3s, color 0.3s;
                                font-weight: 500;
                            }

                            #category-list a:hover {
                                background-color: rgba(255, 255, 255, 0.3);
                                color: #fff;
                            }

                            #category-list .category-item {
                                margin-top: 10px;
                            }
                        </style>
                     </div>
                  </div>
                  
               </div>
            </div>
            <div class="col-md-8" >
               <div class="results" style="padding-top:75px;">
                  <div id="search-results-panel" style="width: 100%;"> <!-- Extend results to full width -->
                     <div id="search-results-panel" style="width: 100%;"> <!-- Extend results to full width -->
                        <!-- Pagination Controls at the Top -->
                        <div data-template="app:pageination" data-template-search-string="yes" data-template-collection="bibl" data-template-sort-options="relevance,title,author,pubPlace,pubDate">
                        </div>
                        
                        <!-- Row for Search Results -->
                        <div class="row">
                           <div class="col-md-12">
                              <!-- Display Search Hits -->
                              <div data-template="search:show-hits" data-template-collection="bibl" style="width: 100%; padding-left: 10px; padding-right: 10px; line-height: 1.5em;">
                                 <!-- Search results will be rendered here by the 'search:show-hits' template -->
                              </div>
                              
                              <!-- Pagination Controls at the Bottom -->
                              <div class="page-bottom">
                                 <div data-template="app:pageination" data-template-collection="bibl"/>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
      
         <style>
        /* Sidebar Styles */
        .sidebar {
            background-color: #702020;
            min-height: calc(100vh - 60px);
            padding: 20px;
            position: fixed;
            width: 25%;
            overflow-y: auto;
            z-index: 1;
        }

        .bibliography-title {
            color: white;
            font-size: 28px;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        /* Search Form Styles */
        .search-container {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .search-container label {
            color: white;
            margin-bottom: 5px;
            display: block;
        }

        .search-container input.keyboard {
            padding: 8px;
            margin-bottom: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
        }

        /* Dynamic Category Styles */
        #category-list h4 {
            color: white;
        }

        #category-list a {
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 10px;
            display: block;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        #category-list a:hover {
            background-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 25%;
            padding: 20px 30px;
        }

        /* Results Styles */
        .record {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .badge {
            background-color: #888;
            margin-right: 10px;
        }

        .btn-success {
            background-color: #4CAF50;
            border: none;
            padding: 10px;
            font-weight: 500;
        }

        .btn-success:hover {
            background-color: #45a049;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .bibliography-title {
                font-size: 24px;
            }
        }

        /* Pagination and Sort Controls */
        .alpha-pages {
            background: white;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .pagination {
            margin: 0;
        }

        .dropdown-menu {
            min-width: 100px;
        }
    </style>
