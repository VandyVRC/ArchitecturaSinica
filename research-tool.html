<?xml version="1.0" encoding="UTF-8"?><html xmlns="http://www.w3.org/1999/xhtml" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:srophe="https://srophe.app">
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      
      <title data-template="config:app-title">App Title</title>
      
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      
      <meta data-template="config:app-meta" />
      
      <link rel="shortcut icon" href="/resources/images/fav-icons/favicon.ico" />
      
      <!-- Bootstrap 3 -->
      
      <link rel="stylesheet" type="text/css" href="/resources/bootstrap/css/bootstrap.min.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/sm-core-css.css" />
      
      <!-- Srophe styles -->
      
      <link rel="stylesheet" type="text/css" href="/resources/css/sm-core-css.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/style.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/css/arch-sinica-main.css" />
      
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alegreya+Sans+SC:100" />
      
      <link rel="stylesheet" type="text/css" media="print" href="/resources/css/print.css" />
      
      <!-- Leaflet -->
      
      <link rel="stylesheet" href="/resources/leaflet/leaflet.css" />
      
      <link rel="stylesheet" href="/resources/leaflet/leaflet.awesome-markers.css" />
      
      <!-- Date Slider -->
      
      <link rel="stylesheet" type="text/css" href="/resources/dateSlider/css/slider.css" />
      
      <link rel="stylesheet" type="text/css" href="/resources/dateSlider/css/slider-classic-min.css" />
      
      <!-- JQuery -->
      
      <link href="/resources/jquery-ui/jquery-ui.min.css" rel="stylesheet" />
      <script type="text/javascript" src="/resources/js/jquery.min.js"></script>
      <script type="text/javascript" src="/resources/jquery-ui/jquery-ui.min.js"></script>
      <script type="text/javascript" src="/resources/js/jquery.smartmenus.min.js"></script>
      <script type="text/javascript" src="/resources/js/clipboard.min.js"></script>
      
      <!-- Bootstrap -->
      <script type="text/javascript" src="/resources/bootstrap/js/bootstrap.min.js"></script>
      
      <!-- Date Slider -->
      <script src="/resources/dateSlider/js/jQDateRangeSlider-min.js"></script>
      <script defer="defer" data-domain="architecturasinica.org" src="https://plausible.io/js/script.js"></script>
      
      <!--<script src="https://www.google.com/recaptcha/api.js" type="text/javascript" async="async" defer="defer"/>-->
      <script type="text/javascript">
            $(document).ready(function () {
                $('[data-toggle="tooltip"]').tooltip({ container: 'body' })
            })
        </script>
      </head>
   <body id="body">
      <script src="resources/js/navbar-search.js"></script>
      <div id="navbar-container"></div>
      <div class="padding-top" style="padding:0; margin-left:-25px;">
            <div class="row">
               <div class="col-md-4" >
                  <div class="sidebar" style="background-color: #702020; height: 100vh; position: fixed; color: white; padding-top:75px;">
                     <h1 class="terminology-title" style="color: white; font-size: 28px; margin-bottom: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Search</h1>
                     <!-- Search Form -->
                     <div class="search-container" style="margin-bottom: 30px;">
                        <form method="get" action="terminology.html" role="form">
                           <div class="form-group">
                              <label for="qs" style="color: white;">Keywords</label>
                              <input type="text" id="qs" name="q" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                           </div>
                           <div class="form-group">
                              <label for="placeName" style="color: white;">Place Name</label>
                              <input type="text" id="placeName" name="placeName" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                           </div>
                           <!-- We will need to re think how to limit by architectural features -->
                           <div class="form-group">
                              <label for="term" style="color: white;">Architectural Feature</label>
                              <input type="text" id="term" name="term" class="form-control keyboard" style="width: 100%; border: none; border-radius: 4px; margin-bottom: 10px;"/>
                           </div>
                           <button type="submit" class="btn btn-success btn-block" style="background-color: #4CAF50; border: none;">Search</button>
                           <button type="reset" class="btn btn-info btn-block" style="margin-top: 10px; border: none;">Clear</button>
                        </form>
                     </div>
                     
                     <!-- Dynamic Categories with Improved Style -->
                     <div id="category-list" style="color: white; margin-top: 5px;">
                        <div data-template="app:display-facets" data-template-collection="keywords" data-template-facets="facet-def.xml" style="margin-top: 10px;">
                           <div id="terminology-facets"></div>
                           <!-- Styling for categories -->
                           <style>
                            #terminology-facets h4 {
                                color: white;
                                font-weight: bold;
                                margin-bottom: 15px;
                            }

                            #terminology-facets a {
                                color: rgba(255, 255, 255, 0.9);
                                font-size: 15px;
                                padding: 10px 15px;
                                text-decoration: none;
                                display: block;
                                margin: 6px 0;
                                background-color: rgba(255, 255, 255, 0.15);
                                border-radius: 8px;
                                transition: background-color 0.3s, color 0.3s;
                                font-weight: 500;
                            }

                            #terminology-facets a:hover {
                                background-color: rgba(255, 255, 255, 0.3);
                                color: #fff;
                            }

                            #terminology-facets .category-item {
                                margin-top: 10px;
                            }
                        </style>
                        </div>
                     </div>
                     
                  </div>
               </div>
               <div class="col-md-8" >
                  <div class="results" style="padding-top:75px;">
                     <div id="search-results-panel" style="width: 100%;"> <!-- Extend results to full width -->
                        <h1>Search results</h1>
                        <div data-template="app:pageination" data-template-search-string="yes" data-template-collection="keywords" data-template-sort-options="relevance,title"/>
                        <div data-template="search:show-hits" data-template-collection="keywords"/> <!-- Added padding to separate result number and title -->
                        <div data-template="app:pageination" data-template-collection="keywords"/>
                     </div>
                  </div>
               </div>
            </div>
         </div>
         
         
      <style>
        /* Sidebar Styles */
        .sidebar {
            background-color: #702020;
            min-height: calc(100vh - 60px);
            padding: 20px;
            position: fixed;
            width: 25%;
            overflow-y: auto;
            z-index: 1;
        }
        .terminology-facets .facet-grp {color: white !important;}
        
        .terminology-title {
            color: white;
            font-size: 28px;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
      
        /* Search Form Styles */
        .search-container {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .search-container label {
            color: white;
            margin-bottom: 5px;
            display: block;
        }

        .search-container input.keyboard {
            padding: 8px;
            margin-bottom: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
        }

        /* Dynamic Category Styles */
        #terminology-facets h4 {
            color: white;
        }

        #terminology-facets button {
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 10px;
            display: block;
            width:100%;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        #terminology-facets button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 25%;
            padding: 20px 30px;
        }

        /* Results Styles */
        .record {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .badge {
            background-color: #888;
            margin-right: 10px;
        }

        .btn-success {
            background-color: #4CAF50;
            border: none;
            padding: 10px;
            font-weight: 500;
        }

        .btn-success:hover {
            background-color: #45a049;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .terminology-title {
                font-size: 24px;
            }
        }

        /* Pagination and Sort Controls */
        .alpha-pages {
            background: white;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .pagination {
            margin: 0;
        }

        .dropdown-menu {
            min-width: 100px;
        }
    </style>
      
   </body>
   <script type="text/javascript" src="/resources/js/search.js"></script>
   <script type="text/javascript" src="/resources/js/jquery.validate.min.js"></script>
   <script type="text/javascript" src="/resources/js/srophe.js"></script>
   </html>
